      <stop offset="0" stop-color="#24361f"/><stop offset="1" stop-color="#0d130c"/>
    </radialGradient>
    <path id="lf" d="M0 0C-6.5 -13 -6.5 -33 0 -52C6.5 -33 6.5 -13 0 0Z"/>
