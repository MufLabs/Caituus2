<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hojas de cannabis Sativa e Indica">
  <defs>
    <radialGradient id="fondo" cx=".5" cy=".35" r="1">
      <stop offset="0" stop-color="#1c2b1e"/><stop offset="1" stop-color="#0f1810"/>
    </radialGradient>
    <path id="lf" d="M0 0C-6.5 -13 -6.5 -33 0 -52C6.5 -33 6.5 -13 0 0Z"/>
  </defs>
  <rect width="480" height="360" fill="url(#fondo)"/>
  <!-- sativa: foliolos finos y claros -->
  <g transform="translate(150 250) rotate(-8)">
    <g fill="#7fa365">
      <path d="M0 0C-5 -18 -5 -52 0 -84C5 -52 5 -18 0 0Z"/>
      <path d="M0 0C-5 -18 -5 -52 0 -84C5 -52 5 -18 0 0Z" transform="rotate(34) scale(.82)"/>
      <path d="M0 0C-5 -18 -5 -52 0 -84C5 -52 5 -18 0 0Z" transform="rotate(-34) scale(.82)"/>
      <path d="M0 0C-5 -18 -5 -52 0 -84C5 -52 5 -18 0 0Z" transform="rotate(66) scale(.55)"/>
      <path d="M0 0C-5 -18 -5 -52 0 -84C5 -52 5 -18 0 0Z" transform="rotate(-66) scale(.55)"/>
    </g>
    <rect x="-2" y="-2" width="4" height="34" rx="2" fill="#63854c"/>
    <text x="0" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="4" fill="#7fa365">SATIVA</text>
  </g>
  <!-- indica: foliolos anchos y oscuros -->
  <g transform="translate(330 250) rotate(8)">
    <g fill="#37563c">
      <path d="M0 0C-10 -16 -10 -48 0 -78C10 -48 10 -16 0 0Z"/>
      <path d="M0 0C-10 -16 -10 -48 0 -78C10 -48 10 -16 0 0Z" transform="rotate(32) scale(.85)"/>
      <path d="M0 0C-10 -16 -10 -48 0 -78C10 -48 10 -16 0 0Z" transform="rotate(-32) scale(.85)"/>
      <path d="M0 0C-10 -16 -10 -48 0 -78C10 -48 10 -16 0 0Z" transform="rotate(62) scale(.6)"/>
      <path d="M0 0C-10 -16 -10 -48 0 -78C10 -48 10 -16 0 0Z" transform="rotate(-62) scale(.6)"/>
    </g>
    <rect x="-2" y="-2" width="4" height="34" rx="2" fill="#2c4630"/>
    <text x="0" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="4" fill="#9dbe83">INDICA</text>
  </g>
  <text x="240" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="4" fill="#6e7563">ENERGÍA DE DÍA · DESCANSO DE NOCHE</text>
</svg>
