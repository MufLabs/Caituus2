<svg viewBox="0 0 480 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frasco ámbar con gotero y gota de CBD">
  <defs>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5316"/><stop offset=".45" stop-color="#d29a3f"/><stop offset=".75" stop-color="#a86a20"/><stop offset="1" stop-color="#6e4210"/>
    </linearGradient>
    <radialGradient id="fondo" cx=".5" cy=".28" r="1">
      <stop offset="0" stop-color="#1c2b1e"/><stop offset="1" stop-color="#0f1810"/>
    </radialGradient>
    <path id="lf" d="M0 0C-6.5 -13 -6.5 -33 0 -52C6.5 -33 6.5 -13 0 0Z"/>
    <g id="hoja">
