    </g>
  </defs>
  <rect width="480" height="600" fill="url(#fondo)"/>
  <ellipse cx="240" cy="540" rx="150" ry="17" fill="#000" opacity=".32"/>
  <!-- frasco grande -->
  <rect x="140" y="300" width="200" height="232" rx="24" fill="url(#vidrio)"/>
  <path d="M140 328c0-30 40-44 100-44s100 14 100 44" fill="url(#vidrio)"/>
  <rect x="216" y="236" width="48" height="60" fill="#7a4a12"/>
  <rect x="158" y="322" width="16" height="190" rx="8" fill="#fff" opacity=".15"/>
  <rect x="158" y="380" width="164" height="130" rx="6" fill="#f6efdd"/>
