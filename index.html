<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caituus — Productos Esenciales de Cannabis</title>
    <meta name="description" content="Medicinal Cannabis" />
    <meta
      name="keywords"
      content="cannabis, cannabis for pets, cannabis for humans, cbd, thc, cannabis pure extract, cannabis oil, medicinal cannabis, cannabis medicinal, cbd mascotas, cbd humanos, extracto thc, extracto puro cannabis, aceite de cannabis, aceite cbd"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Raleway:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0e140d;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p style="color: #f1ecdc; font-family: sans-serif; padding: 2rem">
        Caituus requiere JavaScript para funcionar.
      </p>
    </noscript>

    <div
      id="app-loader"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0e140d;
        color: #f1ecdc;
        font-family: 'Raleway', sans-serif;
        text-align: center;
        padding: 24px;
      "
    >
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#9cc184" stroke-width="1.4" stroke-linecap="round">
        <path d="M7.2 4.6c4.4-2.6 9.6-1 11.8 3s.4 9.4-4 12-9.6 1-11.8-3-.4-9.4 4-12Z" />
        <path d="M8.4 5.4c2.4 1.8 2 4.6 3.9 6.8s4.8 2.6 5.2 5.8" />
      </svg>
      <div
        style="
          font-family: 'Lora', serif;
          font-size: 26px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
        "
      >
        Caituus
      </div>
      <div
        style="
          width: 46px;
          height: 46px;
          border-radius: 50%;
          border: 3px solid rgba(156, 193, 132, 0.25);
          border-top-color: #e8bb62;
          animation: caituus-spin 0.9s linear infinite;
        "
      ></div>
      <div style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #a3a08c">
        CARGANDO LA VITRINA…
      </div>
      <style>
        @keyframes caituus-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>

    <script>
      (function () {
        var boot = document.getElementById("app-loader");
        var done = false;
        function finish() {
          if (done) return;
          done = true;
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }
        window.__CAITUUS_MOUNTED__ = finish;

        function diag(title, detail) {
          if (!boot) return;
          boot.innerHTML =
            '<div style="max-width:540px;border:1px solid rgba(198,98,69,.5);border-radius:12px;padding:26px;background:#131a12">' +
            '<div style="font-family:Georgia,serif;font-size:20px;color:#f1ecdc">' +
            title +
            "</div>" +
            '<div style="margin-top:12px;font-family:monospace;font-size:12px;line-height:1.7;color:#e07f5c;white-space:pre-wrap;text-align:left">' +
            detail +
            "</div>" +
            '<div style="margin-top:14px;font-size:12px;color:#a3a08c">Recarga con Ctrl + Shift + R · Si persiste, copia este mensaje y compártelo.</div>' +
            "</div>";
        }
        window.__CAITUUS_DIAG__ = diag;

        window.addEventListener("error", function (e) {
          var t = e.target;
          if (t && (t.tagName === "SCRIPT" || t.tagName === "LINK")) {
            var el = t;
            function probe(url) {
              fetch(url, { method: "HEAD", mode: "no-cors" })
                .then(function () {
                  diag(
                    "Un recurso no se pudo ejecutar",
                    "El archivo existe pero el navegador no pudo ejecutarlo:\n" +
                      (el.src || el.href) +
                      "\n\nPosible bloqueo del navegador o de la red. Prueba otro navegador o recarga forzada."
                  );
                })
                .catch(function () {
                  diag(
                    "Un recurso no se encontró",
                    "No se pudo descargar:\n" +
                      (el.src || el.href) +
                      "\n\nPresiona «Update branch» de nuevo en el entorno para resincronizar los archivos."
                  );
                });
            }
            probe(el.src || el.href);
          } else {
            finish();
            if (window.__CAITUUS_SHOW_RUNTIME__) window.__CAITUUS_SHOW_RUNTIME__(e.error || e.message);
          }
        }, true);

        setTimeout(function () {
          if (done) return;
          var scripts = Array.prototype.slice
            .call(document.querySelectorAll("script[src]"))
            .map(function (s) {
              return (s.src.indexOf("/assets/") !== -1 || s.src.indexOf("assets/") !== -1 ? "JS  " : "otro ") + s.src;
            })
            .join("\n");
          diag(
            "La aplicación no se montó después de 8 segundos",
            "Recursos detectados en la página:\n" +
              (scripts || "(ningún script encontrado)") +
              "\n\nCausas probables:\n1) La vista previa necesita recarga forzada (Ctrl + Shift + R).\n2) El entorno no entregó el JavaScript compilado: presiona «Update branch» y recarga.\n3) La vista previa sirve desde otra ruta: el cargador de respaldo ya intentó rutas relativas."
          );
        }, 8000);
      })();
    </script>

    <script>
      /* Cargador de respaldo: si la app no monta, reintenta con rutas relativas */
      (function () {
        function rel(path) {
          var l = window.location;
          var base = l.pathname.replace(/\/[^/]*\.[^/]*$/, "").replace(/\/$/, "");
          return base + "/" + path;
        }
        function inject(type, src, attrs) {
          var el = document.createElement(type);
          if (type === "script") {
            el.src = src;
            el.type = "module";
          } else {
            el.href = src;
            el.rel = "stylesheet";
          }
          if (attrs) attrs(el);
          document.head.appendChild(el);
          return el;
        }
        window.addEventListener("load", function () {
          setTimeout(function () {
            var app = document.getElementById("root");
            if (app && app.children.length) return;
            /* Reintenta los recursos compilados con rutas relativas */
            Array.prototype.slice.call(document.querySelectorAll('script[src*="assets"]')).forEach(function (s) {
              var m = s.src.match(/assets\/[^/?#]+/);
              if (m) inject("script", rel(m[0]));
            });
            Array.prototype.slice.call(document.querySelectorAll('link[rel="stylesheet"][href*="assets"]')).forEach(function (l) {
              var m = l.href.match(/assets\/[^/?#]+/);
              if (m) inject("link", rel(m[0]));
            });
          }, 2500);
        });
      })();
    </script>
  </body>
</html>
