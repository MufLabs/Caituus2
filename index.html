<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caituus — Productos Esenciales de Cannabis</title>
    <meta name="description" content="Medicinal Cannabis" />
    <meta
      name="keywords"
      content="cannabis, cannabis for pets, cannabis for humans, cbd, thc, cannabis pure extract, cannabis oil, medicinal cannabis, cannabis medicinal, cbd mascotas, cbd humanos, extracto thc, extracto puro cannabis, aceite de cannabis, aceite cbd"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Raleway:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #f1eee3;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f1eee3;font-family:Georgia,serif">
        <div style="width:44px;height:44px;border-radius:50%;border:4px solid #d9d3be;border-top-color:#5d9463;animation:bootspin 0.9s linear infinite"></div>
        <p style="margin:0;color:#4b5344;font-size:15px;letter-spacing:0.08em">Cargando Caituus…</p>
        <style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script>
      window.__showBootError = function (msg) {
        var splash = document.getElementById("boot-splash");
        if (!splash || splash.dataset.failed) return;
        splash.dataset.failed = "1";
        splash.innerHTML =
          '<div style="max-width:560px;margin:0 24px;padding:28px;border:1px solid #c66245;border-radius:10px;background:#f8f6ec;font-family:system-ui,sans-serif">' +
          '<p style="margin:0 0 8px;font-family:Georgia,serif;font-size:22px;color:#2b322a">La página no pudo cargar</p>' +
          '<p style="margin:0 0 14px;font-size:14px;color:#4b5344">Ocurrió un error al iniciar. Recarga con Ctrl + Shift + R. Si persiste, copia y comparte este mensaje:</p>' +
          '<code style="display:block;max-height:160px;overflow:auto;padding:12px;border-radius:8px;background:#f1eee3;border:1px solid #d9d3be;font-size:12px;color:#a94f35;white-space:pre-wrap;word-break:break-word">' +
          String(msg).replace(/</g, "&lt;") +
          "</code>" +
          '<button onclick="location.reload()" style="margin-top:16px;padding:10px 22px;border:none;border-radius:999px;background:#37563c;color:#f1eee3;font-size:14px;font-weight:700;cursor:pointer">Reintentar</button>' +
          "</div>";
      };
      window.addEventListener("error", function (e) {
        window.__showBootError(e.message + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__showBootError("Promesa rechazada: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      setTimeout(function () {
        var root = document.getElementById("root");
        var splash = document.getElementById("boot-splash");
        if (root && root.children.length <= 1 && splash && !splash.dataset.failed) {
          window.__showBootError(
            "La aplicación no se montó después de 8 segundos. Posibles causas: la vista previa necesita recarga forzada (Ctrl + Shift + R) o un recurso no cargó."
          );
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
