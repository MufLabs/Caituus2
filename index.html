<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caituus — Productos Esenciales de Cannabis</title>
    <meta name="description" content="Medicinal Cannabis" />
    <meta
      name="keywords"
      content="cannabis, cannabis for pets, cannabis for humans, cbd, thc, cannabis pure extract, cannabis oil, medicinal cannabis, cannabis medicinal, cbd mascotas, cbd humanos, extracto thc, extracto puro cannabis, aceite de cannabis, aceite cbd"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Raleway:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #f1eee3;
      }
      #boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f1eee3;
        font-family: "Raleway", "Trebuchet MS", sans-serif;
        color: #2b322a;
        box-sizing: border-box;
      }
      #boot-card {
        max-width: 620px;
        width: 100%;
        text-align: center;
        background: #f8f6ec;
        border: 1px solid #d9d3be;
        border-radius: 14px;
        padding: 36px 30px;
        box-shadow: 0 24px 60px -30px rgba(43, 50, 42, 0.35);
      }
      #boot-card h1 {
        margin: 0 0 10px;
        font-family: "Lora", Georgia, serif;
        font-size: 24px;
        font-weight: 600;
        color: #2b322a;
      }
      #boot-card p {
        margin: 0;
        font-size: 13px;
        line-height: 1.65;
        color: #6e7563;
        word-break: break-word;
      }
      .boot-leaf {
        display: inline-block;
        width: 34px;
        height: 34px;
        margin-bottom: 14px;
        color: #4c7f53;
        animation: bootpulse 1.6s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(0.88);
        }
      }
    </style>
    <script>
      /* ------------------------------------------------------------
         Shim de carga: si la vista previa sirve el sitio desde una
         subcarpeta, las rutas absolutas /assets/... no resuelven y la
         app nunca monta. Este shim (JS clásico, sin dependencias)
         recarga los recursos con rutas relativas cuando eso ocurre.
         ------------------------------------------------------------ */
      document.addEventListener("DOMContentLoaded", function () {
        var root = document.getElementById("root");
        if (root && root.children.length > 0) return;
        var shimmed = [];
        document.querySelectorAll('link[rel="stylesheet"][href^="/"]').forEach(function (l) {
          var nl = document.createElement("link");
          nl.rel = "stylesheet";
          nl.href = "." + l.getAttribute("href");
          document.head.appendChild(nl);
          shimmed.push(nl.href);
        });
        document.querySelectorAll('script[type="module"][src^="/"]').forEach(function (s) {
          var ns = document.createElement("script");
          ns.type = "module";
          ns.src = "." + s.getAttribute("src");
          document.body.appendChild(ns);
          shimmed.push(ns.src);
        });
        window.__caituusShim = shimmed;
      });
    </script>
    <script type="module">
      /* Diagnóstico de arranque: reporta errores y el estado HTTP de cada recurso */
      const fallback = document.getElementById("boot-fallback");
      const msgs = [];
      const showCard = (title, detail) => {
        if (!fallback) return;
        fallback.hidden = false;
        const card = fallback.querySelector("#boot-card");
        if (card) {
          card.innerHTML =
            '<svg class="boot-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7.2 4.6c4.4-2.6 9.6-1 11.8 3s.4 9.4-4 12-9.6 1-11.8-3-.4-9.4 4-12Z"/><path d="M8.4 5.4c2.4 1.8 2 4.6 3.9 6.8s4.8 2.6 5.2 5.8"/></svg>' +
            "<h1>" + title + "</h1><p>" + detail + "</p>";
        }
      };

      window.addEventListener(
        "error",
        (e) => {
          const t = e.target;
          if (t && t.tagName === "SCRIPT" && t.src) msgs.push("No se pudo cargar el script: " + t.src);
          else if (t && t.tagName === "LINK" && t.href) msgs.push("No se pudo cargar el estilo: " + t.href);
          else msgs.push("Error en la página: " + (e.message || "desconocido"));
          showCard(
            "La página no pudo cargar",
            msgs.join("<br><br>") +
              "<br><br>Haz una recarga forzada (Ctrl + Shift + R). Si persiste, copia y pega este mensaje."
          );
        },
        true
      );
      window.addEventListener("unhandledrejection", (e) => {
        msgs.push(
          "Proceso fallido: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason))
        );
        showCard("La página no pudo cargar", msgs.join("<br><br>"));
      });

      const poll = setInterval(() => {
        const root = document.getElementById("root");
        if (root && root.children.length > 0) {
          clearInterval(poll);
          clearTimeout(boot);
          if (fallback) fallback.remove();
        }
      }, 200);

      const boot = setTimeout(async () => {
        clearInterval(poll);
        const report = [];
        const probe = async (url, kind) => {
          try {
            const r = await fetch(url, { method: "GET" });
            report.push(kind + " " + url + " → HTTP " + r.status);
          } catch {
            report.push(kind + " " + url + " → fallo de red o CORS");
          }
        };
        for (const s of document.querySelectorAll('script[type="module"][src]')) {
          if (!s.src.startsWith("data:")) await probe(s.src, "JS");
        }
        for (const l of document.querySelectorAll('link[rel="stylesheet"][href]')) {
          if (!l.href.includes("fonts.g")) await probe(l.href, "CSS");
        }
        showCard(
          "Diagnóstico Caituus",
          (msgs.length ? msgs.join("<br><br>") + "<br><br>" : "") +
            "La aplicación no se montó después de 9 segundos.<br><br>" +
            "Estado de los recursos:<br>" +
            (report.join("<br>") || "No se detectaron recursos externos") +
            (window.__caituusShim && window.__caituusShim.length
              ? "<br><br>(Se intentó recarga con rutas relativas: " +
                window.__caituusShim.length +
                " recursos)"
              : "") +
            "<br><br>Haz una recarga forzada (Ctrl + Shift + R). Si persiste, copia y pega TODO este mensaje."
        );
      }, 9000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" role="status" aria-live="polite">
      <div id="boot-card">
        <svg class="boot-leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M7.2 4.6c4.4-2.6 9.6-1 11.8 3s.4 9.4-4 12-9.6 1-11.8-3-.4-9.4 4-12Z" />
          <path d="M8.4 5.4c2.4 1.8 2 4.6 3.9 6.8s4.8 2.6 5.2 5.8" />
        </svg>
        <h1>Cargando Caituus…</h1>
        <p>Preparando la tienda de productos esenciales de cannabis.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
